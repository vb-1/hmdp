server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dianping?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

  kafka:
    # 指定kafka server的地址，集群配多个，中间，逗号隔开
    bootstrap-servers: 127.0.0.1:9092
    producer:
      retries: 3
      batch-size: 1000
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: voucher-order-group  # 1. 消费者组ID
      auto-offset-reset: earliest    # 2. 偏移量重置策略
      max-poll-records: 4000            # 3. 单次拉取最大记录数
      enable-auto-commit: true          # 4. 是否启用自动提交偏移量
      auto-commit-interval: 1000        # 5. 自动提交偏移量的时间间隔 (毫秒)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hmdp.entity" # <--- 添加或修改此行
  hmdp:
    jwt:
      secret: "YourVeryLongAndSecureSecretKeyForHmdpAppPleaseChangeThis" # 务必修改为一个安全的密钥
      short-token:
#        expiration-millis: 86400000 # 短令牌有效期1天 (毫秒)
         expiration-millis: 30000 # 测试时可以设置为1分钟
      issuer: "hmdp-app" # 签发者
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug